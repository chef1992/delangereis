<style>
/* =========================================================
   Alles wat je wilt wijzigen staat onderin, in het blok
   INSTELLINGEN. Daar hoef je alleen tekst in te vullen.
   ========================================================= */

:root{
  --geel:  #FEED00;   /* ANWB-geel, uit je eigen kaart gepipetteerd */
  --blauw: #009FE3;
  --paars: #7B3FA0;   /* uit het Peloton-logo */
  --rood:  #E5203C;
  --inkt:  #14140F;
  --kaart: #FFFDF4;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }

body{
  background:var(--geel);
  color:var(--inkt);
  font-family:"Fredoka", system-ui, sans-serif;
  overflow:hidden; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

.scherm{
  position:fixed; inset:0; display:none; flex-direction:column;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  padding-top:calc(14px + env(safe-area-inset-top));
}
.scherm.aan{ display:flex; }

/* Intro is geel, de kaarten en de teller staan op blauw. Daardoor
   wordt de gele kaart een voorwerp in plaats van een vlak. */
#intro, #fout{ align-items:center; justify-content:center; text-align:center; }

.medaille{ width:112px; margin-bottom:18px; animation:zwaai 3.6s ease-in-out infinite; }
@keyframes zwaai{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
#spel, #wacht{ background:var(--blauw); }

/* De openingsfoto ligt als een kaartje op tafel, met de medaille
   als postzegel over de hoek. */
.polaroid{
  position:relative; width:100%; max-width:340px;
  background:var(--kaart); border-radius:10px; padding:9px;
  box-shadow:0 11px 28px rgba(0,0,0,.22);
  transform:rotate(-2.2deg); margin-bottom:22px;
}
.polaroid img{
  width:100%; display:block; border-radius:5px;
  aspect-ratio:4/3; object-fit:cover; max-height:36vh;
}
.polaroid .postzegel{ width:46px; height:55px; top:-11px; right:-9px; transform:rotate(8deg); }

.merk{
  font-family:"Big Shoulders Display", Impact, sans-serif;
  font-weight:800; font-size:clamp(2.6rem, 15vw, 4rem);
  line-height:.88; letter-spacing:.01em; margin:0;
  background:linear-gradient(100deg, var(--paars), var(--rood));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.onder{
  font-family:"Caveat", cursive; font-size:1.42rem;
  margin:4px 0 0; max-width:24ch; line-height:1.38;
  white-space:pre-line;   /* houdt de regelafbreking uit INTROTEKST */
}

.knop{
  margin-top:30px; background:var(--blauw); color:#fff; border:0;
  border-radius:999px; font-family:"Fredoka", sans-serif;
  font-weight:600; font-size:1.12rem; padding:16px 40px; cursor:pointer;
  box-shadow:0 5px 0 #0077aa; transition:transform .1s ease, box-shadow .1s ease;
}
.knop:active{ transform:translateY(4px); box-shadow:0 1px 0 #0077aa; }
.knoppen{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.nee{
  background:none; border:0; cursor:pointer;
  font-family:"Caveat", cursive; font-size:1.2rem;
  color:rgba(0,0,0,.5); text-decoration:underline; padding:4px 10px;
}

.knop.klein{
  font-size:.98rem; padding:12px 26px; margin-top:0;
  background:var(--inkt); box-shadow:0 4px 0 rgba(0,0,0,.45);
}

/* ---------------- voortgang ---------------- */
.balk{ display:flex; gap:6px; justify-content:center; align-items:center; height:16px; flex:0 0 auto; margin-bottom:10px; }
.stip{ width:9px; height:9px; border-radius:50%; border:2px solid rgba(255,255,255,.55); transition:all .3s ease; }
.stip.vol{ background:var(--geel); border-color:var(--geel); transform:scale(1.25); }
.stip.nu { background:#fff; border-color:#fff; transform:scale(1.45); }

/* ---------------- de kaart ---------------- */
.veld{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }

.stapel{ position:relative; width:100%; max-width:400px; aspect-ratio:3/4; max-height:100%; }
.stapel::before, .stapel::after{
  content:""; position:absolute; inset:0;
  background:var(--kaart); border-radius:12px;
  box-shadow:0 5px 16px rgba(0,0,0,.2);
  pointer-events:none; z-index:0;   /* puur decor, mag niets afdekken */
}
.stapel::before{ transform:rotate(-3.5deg) translateY(5px); }
.stapel::after { transform:rotate(2deg) translateY(2px); }

.kaart{ position:absolute; inset:0; z-index:1; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.5,.05,.2,1); }
.kaart.om{ transform:rotateY(180deg); }

.zij{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:12px; overflow:hidden; background:var(--kaart);
  box-shadow:0 9px 26px rgba(0,0,0,.26);
  display:flex; flex-direction:column;
}
.achter{ transform:rotateY(180deg); background:var(--geel); }

.foto{ flex:1 1 auto; position:relative; background:#e8e3d2; overflow:hidden; }
.foto img{ width:100%; height:100%; object-fit:cover; display:block; }
.foto.leeg{ background:var(--geel); }
.foto.leeg img{ display:none; }
.foto.leeg::after{ content:""; position:absolute; inset:0; background:var(--merkje) center/44% no-repeat; opacity:.22; }

.bijschrift{
  flex:0 0 auto; min-height:76px; display:flex; align-items:center;
  padding:12px 16px 14px; font-family:"Caveat", cursive;
  font-size:1.32rem; line-height:1.24; border-top:2px solid rgba(0,0,0,.1);
}
.tik{
  position:absolute; left:0; right:0; bottom:0; padding:9px; text-align:center;
  font-size:.78rem; font-weight:600; color:#fff;
  background:linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events:none;
}

/* De briefkaart legt over de fotokant heen. Geen foto, alleen tekst. */
.briefje{
  position:absolute; inset:0; z-index:2; background:var(--geel);
  display:flex; flex-direction:column; justify-content:center;
  padding:30px 22px; text-align:center;
}
.briefje[hidden]{ display:none; }
.briefje .hand{
  font-family:"Caveat", cursive; font-size:1.5rem; line-height:1.36;
  margin:0; white-space:pre-line;
}
.tikdonker{
  position:absolute; left:0; right:0; bottom:14px;
  margin:0; font-size:.78rem; font-weight:600; color:rgba(0,0,0,.45);
}

.binnen{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; padding:18px 16px 14px; min-height:0; }

.postzegel{
  position:absolute; top:12px; right:12px; width:52px; height:62px;
  background:var(--merkje) center/78% no-repeat, #fff; border-radius:3px;
  box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(0,0,0,.12);
}

.vraag{ font-weight:600; font-size:1.2rem; line-height:1.32; color:var(--inkt); margin:0 58px 0 0; }

.invul{
  margin-top:26px; border:0; border-bottom:2.5px solid rgba(0,0,0,.5);
  background:transparent; width:100%; font-family:"Caveat", cursive;
  font-size:1.72rem; padding:5px 2px; color:var(--inkt); border-radius:0;
}
.invul:focus{ outline:none; border-bottom-color:var(--blauw); }
.invul::placeholder{ color:rgba(0,0,0,.28); }

.regel{ display:flex; gap:10px; align-items:center; margin-top:14px; }
.melding{ font-family:"Caveat", cursive; font-size:1.24rem; line-height:1.3; color:var(--rood); margin:9px 0 0; min-height:1.4em; }

.stempel{
  position:absolute; top:56%; left:57%; width:172px; height:172px; margin:-86px 0 0 -86px;
  border:5px solid var(--rood); border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--rood);
  font-family:"Big Shoulders Display", Impact, sans-serif;
  font-weight:800; font-size:2.1rem; letter-spacing:.04em;
  opacity:0; transform:scale(2.6) rotate(-24deg); pointer-events:none;
}
.stempel::before{ content:""; position:absolute; inset:9px; border:2.5px solid var(--rood); border-radius:50%; }
.stempel.knal{ animation:knal .42s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes knal{
  0%{ opacity:0; transform:scale(2.6) rotate(-24deg); }
  55%{ opacity:.95; transform:scale(.92) rotate(-13deg); }
  100%{ opacity:.95; transform:scale(1) rotate(-13deg); }
}

.schud{ animation:schud .38s ease; }
@keyframes schud{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(4px);} }

.weg{ animation:weg .5s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes weg{ to{ transform:translate(115%, -22%) rotate(19deg); opacity:0; } }

.aankomst{ animation:aankomst .46s cubic-bezier(.2,.9,.3,1); }
@keyframes aankomst{ from{ transform:translateY(38px) scale(.94); opacity:0; } }

/* ---------------- de wachtkaart met de teller ---------------- */

.wachtkaart{
  position:absolute; inset:0; z-index:1; border-radius:12px; overflow:hidden;
  background:var(--geel); box-shadow:0 9px 26px rgba(0,0,0,.26);
  display:flex; flex-direction:column; justify-content:center;
  padding:22px 18px; text-align:center;
}
.wachtkaart .hand{
  font-family:"Caveat", cursive; font-size:1.24rem; line-height:1.32;
  margin:0 40px 0 0; white-space:pre-line;
}

.cellen{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:24px 0 0; }
.cel{ background:rgba(0,0,0,.07); border-radius:8px; padding:11px 2px 8px; }
.cijfer{
  display:block; font-weight:700; font-size:clamp(1.4rem,7vw,1.9rem);
  color:var(--blauw); line-height:1; font-variant-numeric:tabular-nums;
}
.eenheid{ display:block; margin-top:6px; font-size:.62rem; font-weight:600; letter-spacing:.05em; color:rgba(0,0,0,.5); }

.datumregel{
  font-family:"Big Shoulders Display", Impact, sans-serif; font-weight:800;
  font-size:1.9rem; margin:16px 0 0; letter-spacing:.01em;
  background:linear-gradient(100deg, var(--paars), var(--rood));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.naregel{ font-family:"Caveat", cursive; font-size:1.22rem; margin:8px 0 0; color:rgba(0,0,0,.6); }

.open .cellen, .open .naregel{ display:none; }

.voet{
  flex:0 0 auto; text-align:center; padding-top:9px;
  font-family:"Big Shoulders Display", Impact, sans-serif;
  font-size:.82rem; letter-spacing:.16em; color:rgba(255,255,255,.62);
}

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

<section id="intro" class="scherm aan">

    <div class="postzegel"></div>

  </div>

</section>

<section id="spel" class="scherm">

        <div class="zij voor" id="voor">

        </div>

      </div>
    </div>
  </div>
  <div class="voet">PELOTON DER ELEGANTIE</div>
</section>

<section id="fout" class="scherm">

<section id="wacht" class="scherm">

    <div class="stapel">
      <div class="wachtkaart" id="wachtkaart">

      </div>
    </div>
  </div>
  <div class="voet">PELOTON DER ELEGANTIE</div>
</section>

  var SLEUTEL = "reis_stand_v2";

  function bewaar(n){ try{ localStorage.setItem(SLEUTEL, n); }catch(e){} }

  function gelezen(){
    var n;
    try{ n = parseInt(localStorage.getItem(SLEUTEL), 10); }catch(e){ return 0; }
    if (!n || n < 0) return 0;
    // Staat er een stand opgeslagen die hoger is dan het aantal kaarten van
    // nu? Dan komt hij uit een oudere versie en begint hij gewoon opnieuw.
    if (n > RONDES.length) return 0;
    return n;
  }

  function schoon(t){ return t.toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function toon(id){
    var s = document.querySelectorAll(".scherm");
    for (var k = 0; k < s.length; k++) s[k].classList.remove("aan");
    E(id).classList.add("aan");
  }

  function tekenBalk(){
    var b = E("balk"); b.innerHTML = "";
    for (var k = 0; k < RONDES.length; k++){
      var d = document.createElement("span");
      d.className = "stip" + (k < i ? " vol" : k === i ? " nu" : "");
      b.appendChild(d);
    }
  }

  /* ---- de teller ---- */

  function twee(n){ return n < 10 ? "0" + n : String(n); }

  function tik(){
    var over = DOEL.getTime() - Date.now();
    if (over <= 0){
      E("wachtkaart").classList.add("open");
      E("wachttekst").textContent = OPENTEKST;
      return false;
    }
    var sec = Math.floor(over / 1000);
    E("d").textContent = String(Math.floor(sec / 86400));
    E("u").textContent = twee(Math.floor(sec / 3600) % 24);
    E("m").textContent = twee(Math.floor(sec / 60) % 60);
    E("s").textContent = twee(sec % 60);
    return true;
  }

  function naarWacht(){
    toon("wacht");
    if (tik()){
      var klok = setInterval(function(){ if (!tik()) clearInterval(klok); }, 1000);
    }
  }

  /* ---- de kaarten ---- */

  function zetFoto(pad, bijschrift){
    var vak = E("fotovak"), beeld = E("fotobeeld");

    // De briefkaart heeft geen foto. Zonder deze afslag vraagt de browser
    // een bestand met de naam "undefined" op en krijgt een 404 terug.
    if (!pad){
      beeld.removeAttribute("src");
      vak.classList.add("leeg");
      E("bijschrift").textContent = bijschrift || "";
      return;
    }

    vak.classList.remove("leeg");
    beeld.onerror = function(){ vak.classList.add("leeg"); };
    beeld.src = (INGEBAKKEN && INGEBAKKEN[pad]) || pad;
    E("bijschrift").textContent = bijschrift || "";
  }

  function volgende(){
    if (i >= RONDES.length){ naarWacht(); return; }

    var r = RONDES[i];
    pogingen = 0;
    kaart.classList.remove("om", "weg");
    E("stempel").classList.remove("knal");
    E("melding").textContent = "";
    E("invul").value = "";
    tekenBalk();
    zetFoto(r.foto, r.bijschrift);

    if (r.type === "tekst"){
      E("briefje").hidden = false;
      E("brieftekst").textContent = r.tekst || VOORAF;
    } else {
      E("briefje").hidden = true;
      E("tik").style.display = "";
      E("tik").textContent = r.type === "foto" ? "tik voor de volgende" : "tik om om te draaien";
      if (r.type === "vraag") E("vraag").textContent = r.vraag;
    }

    stapel.classList.remove("aankomst");
    void stapel.offsetWidth;
    stapel.classList.add("aankomst");

    bezig = false;
  }

  function wegEnDoor(){
    bezig = true;
    kaart.classList.add("weg");
    setTimeout(function(){ i++; bewaar(i); volgende(); }, 500);
  }

  E("voor").addEventListener("click", function(){
    var r = RONDES[i];
    if (!r || bezig) return;
    if (r.type === "foto" || r.type === "tekst"){ wegEnDoor(); return; }
    if (kaart.classList.contains("om")) return;   // al omgedraaid
    kaart.classList.add("om");
    E("tik").style.display = "none";
    setTimeout(function(){ E("invul").focus(); }, 380);
  });

  function nakijken(){
    var r = RONDES[i];
    if (!r || r.type !== "vraag" || bezig) return;

    var ingevuld = schoon(E("invul").value);
    if (!ingevuld) return;

    var goed = false;

    if (r.alle){
      // alle woorden moeten voorkomen
      goed = true;
      for (var k = 0; k < r.alle.length; k++){
        if (ingevuld.indexOf(schoon(r.alle[k])) === -1){ goed = false; break; }
      }
    } else {
      // een van de woorden is genoeg
      for (var k = 0; k < r.goed.length; k++){
        if (ingevuld.indexOf(schoon(r.goed[k])) !== -1){ goed = true; break; }
      }
    }

    if (goed){
      bezig = true;
      E("invul").blur();
      E("stempel").classList.add("knal");
      E("melding").style.color = "var(--paars)";
      E("melding").textContent = r.na || "";
      setTimeout(wegEnDoor, 1250);
      return;
    }

    pogingen++;

    if (pogingen >= MAX_POGINGEN){
      E("invul").blur();
      toon("fout");
      return;
    }

    E("melding").style.color = "var(--rood)";
    E("melding").textContent = pogingen >= 3 && r.hint ? r.hint : "Nee joh. Nog een keer.";
    stapel.classList.remove("schud");
    void stapel.offsetWidth;
    stapel.classList.add("schud");
    E("invul").select();
  }

  E("check").addEventListener("click", nakijken);
  E("invul").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); nakijken(); }
  });

  // Fout gegaan? Dan helemaal terug naar de eerste kaart.
  E("opnieuw").addEventListener("click", function(){
    i = 0;
    bezig = false;
    bewaar(0);
    E("fouttekst").textContent = FOUTTEKST;
    E("nee").hidden = false;
    toon("spel");
    volgende();
  });

  E("nee").addEventListener("click", function(){
    E("fouttekst").textContent = NEETEKST;
    E("nee").hidden = true;
  });

  E("start").addEventListener("click", function(){
    bezig = false;
    i = Math.min(gelezen(), RONDES.length);
    if (i >= RONDES.length){ naarWacht(); return; }
    toon("spel");
    volgende();
  });
